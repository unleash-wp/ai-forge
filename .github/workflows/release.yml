# Automated release. Push a version tag (`npm version patch && git push --tags`)
# and this publishes @unleashwp/ai-forge to npm, attaches the .mcpb to a GitHub
# Release, and mirrors the same version to GitHub Packages as @unleash-wp/ai-forge
# All in one workflow, so no step depends on a token-triggered event.
#
# One-time npm auth (pick ONE): (A) Trusted Publishing (tokenless OIDC) configured
# on the package, or (B) an npm automation token as repo secret NPM_TOKEN. The very
# first publish of a new scoped name is done once by hand; this takes over after.
#
# Every step is idempotent: re-pushing an existing tag skips the already-published
# version instead of failing.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    # Stays on GitHub-hosted runners, deliberately. This repository is PUBLIC:
    # a pull_request workflow runs a stranger's code, and on our own runner that
    # is our filesystem, our SSH agent and our deploy key. See lumo-pro's
    # docs/self-hosted-runner.md. Do not add the RUNNER_LABEL switch here -- it
    # also reads organisation variables, so it would move this repo too.
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # npm OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # One version source = package.json. The tag must match it, and every derived
      # file (manifest.json AND every plugins/*/plugin.json) must already be in sync.
      # Running sync-version must produce no changes. Otherwise a derived version
      # drifted and would ship (e.g. a bundled plugin.json flagged as "update
      # available" against its own release).
      - name: Check versions are in sync
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2; exit 1
          fi
          node scripts/sync-version.mjs
          if [ -n "$(git status --porcelain)" ]; then
            echo "Derived versions out of sync with package.json ($PKG). Run: node scripts/sync-version.mjs, commit, re-tag." >&2
            git --no-pager diff HEAD; exit 1
          fi

      - name: Build the browser UI bundle
        run: npm run build

      - name: Unit tests
        run: node --test

      - name: Publish to npm (provenance, skip if already published)
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "@unleashwp/ai-forge@$V" version >/dev/null 2>&1; then
            echo "@unleashwp/ai-forge@$V already on npm, skipping publish"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack the Claude Desktop bundle
        run: npm run mcpb:pack

      - name: Create or update the GitHub Release with the .mcpb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" unleashwp-ai-forge.mcpb --clobber
          else
            gh release create "$GITHUB_REF_NAME" unleashwp-ai-forge.mcpb --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # Mirror the same version to GitHub Packages (as @unleash-wp/ai-forge, because GitHub
  # Packages scopes to the org name). Runs in the same workflow so it's automatic.
  mirror:
    needs: publish
    # Stays on GitHub-hosted runners, deliberately. This repository is PUBLIC:
    # a pull_request workflow runs a stranger's code, and on our own runner that
    # is our filesystem, our SSH agent and our deploy key. See lumo-pro's
    # docs/self-hosted-runner.md. Do not add the RUNNER_LABEL switch here -- it
    # also reads organisation variables, so it would move this repo too.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build the browser UI bundle
        run: npm run build

      - name: Scope the package to the GitHub org
        run: npm pkg set name=@unleash-wp/ai-forge

      - name: Publish to GitHub Packages (skip if already there)
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "@unleash-wp/ai-forge@$V" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@unleash-wp/ai-forge@$V already on GitHub Packages, skipping"
          else
            npm publish --registry=https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
