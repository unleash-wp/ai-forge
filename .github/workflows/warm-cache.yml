name: Warm the hosted cache

# The hosted instance runs with UWP_OFFLINE=1, so visitor traffic never fans out
# to wp.org. That keeps Automattic from seeing many clients, and it means the
# GitHub-login-to-wordpress.org mapping is never fetched while serving. Without
# it the same person is counted twice and the contributor total is an upper
# bound; the UI says so, which is honest but not right.
#
# This job is the one thing allowed to fetch. It runs with the operator's own
# credentials, never a visitor's, writes into the directory the app reads, and
# then gets out of the way.
#
# Deliberately small, because it is a bridge. The decided answer is the mirror
# in unleash-wp/wp-forge-mirror (#1 real data, #2 deploy, #3 point Forge at it),
# after which no instance needs credentials of its own.
#
# It works. On 2026-08-07 a hand-started run ingested 281 contributors, resolved
# 182 employers, and took identityGap from 87 to 0 on the delivered page.
#
# Getting there took four separate guards off its neck, and they are worth
# listing because each looked deliberate:
#
#   - a wordpress.org cookie demanded of every command. The cookie is Trac's;
#     ingest-profiles never asks Trac anything, and the profile lookup it does
#     use is public. A test had pinned the demand in place.
#   - the wrong command name. `contributors ingest-profiles` ran the REPORTING
#     command and passed "ingest-profiles" along as its `since`: exit 0, no
#     message, nothing warmed.
#   - a GitHub token demanded unconditionally. The mapping costs GitHub nothing,
#     and a cached commit window costs nothing either, so the token gate withheld
#     a fix that was free. Now: the nightly run insists, a hand-started run
#     measures what is left of the anonymous hour and decides.
#   - a second, redundant CLI call afterwards that still carried the cookie gate,
#     so the job reported failure for work that had already succeeded.
#
# What is still wanted is GITHUB_TOKEN in ~/.config/node/.env, for the SERVING
# app rather than for this job: without it every visitor shares 60 requests an
# hour, and the instance has hit that ceiling (unleash-wp/ai-forge#48).

on:
  schedule:
    # Nightly, well away from the deploy window. Warming is not urgent; being
    # warm before the next working day is the whole point.
    - cron: '20 3 * * *'
  workflow_dispatch:

concurrency:
  group: warm-cache
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    name: Warm the wp.org and GitHub caches
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          MITTWALD_SSH_KEY: ${{ secrets.MITTWALD_SSH_KEY }}
          SSH_TARGET: ${{ secrets.MITTWALD_SSH_TARGET }}
        run: |
          install -m 700 -d ~/.ssh
          # A key pasted into a GitHub secret can arrive with literal \n instead
          # of newlines, or with CRLF. Same handling as the deploy workflow.
          printf '%s\n' "$MITTWALD_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            printf '%b\n' "$MITTWALD_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          SSH_HOST="${SSH_TARGET##*@}"
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Warm the cache the app reads
        env:
          SSH_TARGET: ${{ secrets.MITTWALD_SSH_TARGET }}
          # Not a secret, and not a preference: the nightly run must not risk the
          # anonymous GitHub budget visitors share, while a run someone started by
          # hand is someone deciding to. See the branch further down.
          STRICT: ${{ github.event_name != 'workflow_dispatch' }}
        # The remote script goes in on stdin, not as a quoted ssh argument. The
        # deploy beside this one learned the hard way that a single unescaped
        # quote inside such an argument truncates it and the step still exits 0.
        # A heredoc cannot lose its tail that way.
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
              "${SSH_TARGET}" "STRICT='${STRICT}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/forge

          # The app's own cache, named by lumo-pro's supervisor. Filling any
          # other directory is the failure this job exists to avoid: green here,
          # unchanged for every visitor. See unleash-wp/lumo-pro#197.
          export UWP_CACHE_DIR="${FORGE_CACHE_DIR:-$HOME/data/forge-cache}"

          # The operator's credentials live in one place, the file the app is
          # started with. Read them rather than keeping a second copy in GitHub.
          if [ -r ~/.config/node/.env ]; then
            set -a
            . ~/.config/node/.env
            set +a
          fi

          # This job is the opposite of the app: it is allowed to fetch.
          unset UWP_OFFLINE
          # Politeness, not speed. Automattic blocking this address would cost
          # more than a slow night.
          export UWP_FETCH_RPS="${UWP_FETCH_RPS:-2}"

          # A token is what this job should have, and the nightly run insists on
          # one. A hand-started run does not, and the difference is measured
          # rather than assumed.
          #
          # The work splits in two. The profile mapping -- the part that makes
          # identityGap go away -- reads profiles.wordpress.org, which is public
          # and costs GitHub nothing. Only the commit window behind it touches
          # GitHub, and it reads through the cache. When that window is already
          # cached, the whole run makes ZERO GitHub requests, and refusing it for
          # want of a token withholds a fix that costs nothing.
          #
          # Measured: with a warm commit cache and GITHUB_TOKEN unset, the ingest
          # completed -- 199 contributors, employer resolved for 128.
          #
          # So without a token: ask GitHub what is left of the anonymous hour and
          # decide on the answer. A warm run spends none of it. A cold one cannot
          # finish inside 60 requests anyway, and would spend the budget visitors
          # share -- the instance has hit that ceiling before (ai-forge#48).
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            echo '==> GitHub token present'
          elif [ "${STRICT:-true}" = 'true' ]; then
            echo '!! GITHUB_TOKEN is not set in ~/.config/node/.env, and this is the'
            echo '   scheduled run. Nightly warming is not worth any risk to the 60'
            echo '   requests an hour that every visitor shares.'
            echo '!! Nothing was warmed. See unleash-wp/ai-forge#48 -- the SERVING app'
            echo '   needs the same token, so this is not busywork for the job.'
            echo '   To warm now anyway, start this workflow by hand.'
            exit 1
          else
            # From the response HEADER, not the body, and the reason is worth the
            # lines. The first version parsed the JSON with a quoted `node -e`
            # program. On the server node received only the word "let" and died:
            #
            #     ReferenceError: let is not defined
            #
            # What that is NOT: a transport problem. Checked by extracting this
            # step and stubbing ssh -- the program arrives at the far end
            # character for character, and it runs correctly here. So something in
            # the remote node invocation splits its argument, and the remote node
            # is not ours to assume. This job already runs on a host we configure
            # loosely; it should not also depend on how an interpreter there is
            # wrapped.
            #
            # The part that made it costly was the trailing `|| REMAINING=0`,
            # which dressed a crash up as a measured zero -- so the job refused on
            # a number nobody had measured. Same shape as the failures this
            # product is sold to prevent.
            #
            # x-ratelimit-remaining carries the same number, and getting it needs
            # only the tools this script already relies on. Every api.github.com
            # response returns it.
            REMAINING=$(curl -fsS -m 15 -o /dev/null -D - https://api.github.com/rate_limit \
              | tr -d '\r' | awk 'tolower($1) == "x-ratelimit-remaining:" { print $2 }') || REMAINING=''

            # Unreadable is not empty. Keeping the two apart is the same rule the
            # product itself is built on: 503 means no answer was obtained, 403
            # means an answer was obtained and it was no.
            if [ -z "${REMAINING}" ]; then
              echo '!! Could not read x-ratelimit-remaining from api.github.com.'
              echo '   That is NOT the same as having none left, so nothing is assumed.'
              echo '!! Nothing was warmed. Set GITHUB_TOKEN (ai-forge#48) and this'
              echo '   question stops being asked at all.'
              exit 1
            fi

            echo "==> No GitHub token; anonymous requests left this hour: ${REMAINING}"
            if [ "${REMAINING}" -lt 50 ]; then
              echo '!! Too little left to risk. Visitors share this budget.'
              echo '!! Nothing was warmed. Set GITHUB_TOKEN (ai-forge#48) or retry later.'
              exit 1
            fi
            echo '    Proceeding: a cached window needs none of these. If the window is'
            echo '    cold this will run out and fail, which is the honest outcome.'
          fi

          # No wordpress.org cookie is checked for, and that is deliberate. The
          # cookie is Trac's; nothing below reads Trac. Requiring it here is what
          # kept this job from ever running -- a guard for one feature refusing
          # the fix for another.

          # Last full month: the window the "Month in Core" work actually uses,
          # and the one a visitor is most likely to open.
          MONTH=$(date -u -d '1 month ago' +%Y-%m 2>/dev/null || date -u -v-1m +%Y-%m)

          echo "==> Warming wordpress.org profiles for ${MONTH}"
          # Top-level command name, and the only command this job runs.
          #
          # A second call followed it -- the reporting command, to warm the commit
          # cache -- and it warmed nothing: the ingest builds the same report over
          # the same window with a SUPERSET of the options, so the cache was
          # already warm before that line ran. What it did add was the
          # wordpress.org gate, which the reporting command keeps because it
          # reports Trac ticket activity, on a host that has no cookie and is not
          # meant to have one. The run of 2026-08-07 ingested 281 contributors,
          # resolved 182 employers, took identityGap to 0 -- and then exited 1 on
          # that redundant line, reporting failure for work that had succeeded.
          node bin/ai-forge.mjs ingest-profiles --month "$MONTH"

          echo '==> What is in the cache now'
          # Effect, not intent: name the directory and show that it has content.
          ls -la "$UWP_CACHE_DIR"
          test -s "$UWP_CACHE_DIR/ghslug-cache-v1.json"
          echo '===== CACHE WARMED ====='
          REMOTE

      - name: Say what a visitor sees now
        # The number that decides whether this job did anything: identityGap
        # gone means the counts are counts again rather than upper bounds.
        run: |
          set -euo pipefail
          # The SAME window the step above warmed. It used to ask about a fixed
          # 2025-10, which is a different question: a gap there says nothing
          # about whether this run did anything, and no gap there would have
          # reported success for work that never happened.
          MONTH=$(date -u -d '1 month ago' +%Y-%m 2>/dev/null || date -u -v-1m +%Y-%m)
          GAP=$(curl -fsS -m 120 \
            "https://mcp.unleash-wp.com/api/contributors?month=${MONTH}&companies=false&committers=false&tickets=false" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const r=JSON.parse(d).report;console.log(r.identityGap ?? 0)})')
          echo "identityGap for ${MONTH} on the delivered page: ${GAP}"
          if [ "$GAP" != "0" ]; then
            echo "note: still ${GAP} unmatched GitHub logins; the count is an upper bound until this reaches 0"
          fi
