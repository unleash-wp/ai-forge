name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runtime floor: the shipped package runs on Node >=18 (users get a prebuilt
  # dist, they never build), so syntax-check + tests must pass down to 18. No
  # build here. The build toolchain (Babel 8) needs Node >=22 and would falsely
  # fail the 18/20 legs.
  test:
    # Stays on GitHub-hosted runners, deliberately. This repository is PUBLIC:
    # a pull_request workflow runs a stranger's code, and on our own runner that
    # is our filesystem, our SSH agent and our deploy key. See lumo-pro's
    # docs/self-hosted-runner.md. Do not add the RUNNER_LABEL switch here -- it
    # also reads organisation variables, so it would move this repo too.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (no build)
        run: npm ci --ignore-scripts
      # `node --check` only checks the first path it is given, so loop, and cover
      # src/connectors, the tool plugins and scripts, not just src/*.mjs.
      - name: Syntax-check all source modules
        run: |
          shopt -s nullglob   # an unmatched glob must expand to nothing, not a literal path
          for f in src/*.mjs src/connectors/*.mjs plugins/*/*.mjs plugins/*/lib/*.mjs scripts/*.mjs bin/*.mjs webpack.config.cjs; do
            node --check "$f"
          done
      - name: Unit tests
        run: node --test

  # Build coverage: the webpack/Babel toolchain runs on the release Node version.
  build:
    # Stays on GitHub-hosted runners, deliberately. This repository is PUBLIC:
    # a pull_request workflow runs a stranger's code, and on our own runner that
    # is our filesystem, our SSH agent and our deploy key. See lumo-pro's
    # docs/self-hosted-runner.md. Do not add the RUNNER_LABEL switch here -- it
    # also reads organisation variables, so it would move this repo too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (no prepare build)
        run: npm ci --ignore-scripts
      - name: Build the browser UI bundle
        run: npm run build
      - name: Published tarball ships dist/main.js
        run: |
          npm pack --ignore-scripts --dry-run 2>&1 | grep -q 'dist/main.js' || {
            echo "npm pack must include dist/main.js (run npm run build first)" >&2
            exit 1
          }
