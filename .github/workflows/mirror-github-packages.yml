# Manual re-mirror to GitHub Packages (@unleash-wp/ai-forge). The normal path is
# automatic: the Release workflow mirrors every version in its own `mirror` job.
# This exists only to re-push the current version by hand if that ever fails.
# (A `release: published` trigger can't work here: releases created by the
# workflow's GITHUB_TOKEN don't trigger other workflows.)
name: Mirror to GitHub Packages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    # Stays on GitHub-hosted runners, deliberately. This repository is PUBLIC:
    # a pull_request workflow runs a stranger's code, and on our own runner that
    # is our filesystem, our SSH agent and our deploy key. See lumo-pro's
    # docs/self-hosted-runner.md. Do not add the RUNNER_LABEL switch here -- it
    # also reads organisation variables, so it would move this repo too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build the browser UI bundle
        run: npm run build

      - name: Scope the package to the GitHub org
        run: npm pkg set name=@unleash-wp/ai-forge

      - name: Publish to GitHub Packages (skip if already there)
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "@unleash-wp/ai-forge@$V" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@unleash-wp/ai-forge@$V already on GitHub Packages, skipping"
          else
            npm publish --registry=https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
